[workspace]
resolver = "2"
members = ["crates/*", "bins/*", "examples/*"]

[workspace.package]
version = "0.0.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/enknamel/acswarm"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
debug = 1
