[package]
name = "acviewer"
description = "Landblock and model viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ac-dat = { path = "../../crates/ac-dat" }
ac-formats = { path = "../../crates/ac-formats" }
ac-scene = { path = "../../crates/ac-scene" }
ac-net = { path = "../../crates/ac-net" }
ac-world = { path = "../../crates/ac-world" }
ac-audio = { path = "../../crates/ac-audio" }
ac-client = { path = "../../crates/ac-client" }
ac-plugin = { path = "../../crates/ac-plugin" }
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
glam = { version = "0.30", features = ["bytemuck"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
image = { version = "0.25", default-features = false, features = ["png"] }
